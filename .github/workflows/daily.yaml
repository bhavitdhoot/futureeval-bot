name: Daily maintenance

# Once a day:
#   1. find the live bot tournaments and save them to TARGETS.json
#   2. commit that file (this also stops GitHub from auto-disabling the
#      schedule after 60 days without repository activity)
#   3. re-enable the forecast workflow in case GitHub disabled it anyway
#   4. health check: fails (and GitHub emails you) only if you need to act
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: daily-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover live tournaments
        continue-on-error: true
        run: python maintenance.py discover
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          EXTRA_TOURNAMENTS: ${{ vars.EXTRA_TOURNAMENTS }}
      - name: Commit TARGETS.json and heartbeat
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > HEARTBEAT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEARTBEAT
          if [ -f TARGETS.json ]; then git add TARGETS.json; fi
          git commit -m "Daily maintenance [skip ci]" || echo "Nothing to commit"
          git push
      - name: Re-enable forecast workflow if GitHub disabled it
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable forecast.yaml --repo "$GITHUB_REPOSITORY" || true
      - name: Health check (a failure here means GitHub emails you)
        if: always()
        run: python maintenance.py check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CREDIT_FLOOR_USD: ${{ vars.CREDIT_FLOOR_USD }}

name: Forecast on tournament questions

# GitHub delivers only a fraction of frequent cron triggers (observed gaps of
# 2.5 to 8 hours), and tournament questions stay open about 90 minutes. So each
# run stays alive and polls internally for WATCH_MINUTES, and the schedule just
# keeps a run queued: when one finishes, the next pending trigger starts it
# again. Already-forecast questions are skipped, so polling costs nothing
# unless there is something new to forecast.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Forecast (Fall tournament + MiniBench)
        run: python main.py --mode tournament
        env:
          # Secrets (Settings > Secrets and variables > Actions > Secrets)
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings (Settings > Secrets and variables > Actions > Variables).
          # Leave unset to use the defaults described in README.md.
          ROSTER_MODE: ${{ vars.ROSTER_MODE }}
          SKIP_MINIBENCH: ${{ vars.SKIP_MINIBENCH }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          BACKUP_MODELS: ${{ vars.BACKUP_MODELS }}
          PARSER_MODELS: ${{ vars.PARSER_MODELS }}
          EXTRA_TOURNAMENTS: ${{ vars.EXTRA_TOURNAMENTS }}
          # How long one run keeps polling, and how often it looks.
          WATCH_MINUTES: ${{ vars.WATCH_MINUTES || '300' }}
          WATCH_INTERVAL_SECONDS: ${{ vars.WATCH_INTERVAL_SECONDS || '300' }}

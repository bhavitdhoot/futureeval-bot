name: Forecast on tournament questions

# Every 20 minutes, offset from the hour. Tournament questions open in small
# batches at random times and stay open about 1.5 hours, so 20 minutes is
# plenty. Already-forecast questions are skipped automatically.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Forecast (Fall tournament + MiniBench)
        run: python main.py --mode tournament
        env:
          # Secrets (Settings > Secrets and variables > Actions > Secrets)
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings (Settings > Secrets and variables > Actions > Variables).
          # Leave unset to use the defaults described in README.md.
          ROSTER_MODE: ${{ vars.ROSTER_MODE }}
          SKIP_MINIBENCH: ${{ vars.SKIP_MINIBENCH }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          BACKUP_MODELS: ${{ vars.BACKUP_MODELS }}
          PARSER_MODELS: ${{ vars.PARSER_MODELS }}
          EXTRA_TOURNAMENTS: ${{ vars.EXTRA_TOURNAMENTS }}
